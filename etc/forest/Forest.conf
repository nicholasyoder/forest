[General]
needDefaults=false
theme=Round-Dark
icon_theme=Papirus
version=0.12.0

[desktop]
iconsize=48
imagemode=0
showicons=true
wallpaper=/usr/share/wallpapers/forest/forest.jpg

[hotkeys]
item-0001\action="DBUS:bus=Session,service=org.forest,path=/org/forest/panel/mainmenu,method=showmenu"
item-0001\description=Show menu
item-0001\trigger=CTRL+escape
item-0002\action=loginctl lock-session
item-0002\description=Lock screen
item-0002\trigger=LOGO+l
item-0003\action="DBUS:bus=Session,service=org.forest,path=/org/forest/showdesktop,method=toggle"
item-0003\description=Show Desktop
item-0003\trigger=LOGO+d
item-0004\action=pcmanfm-qt
item-0004\description=File Manager
item-0004\trigger=LOGO+e
item-0005\action=qterminal
item-0005\description=Terminal
item-0005\trigger=LOGO+q
item-0006\action="DBUS:bus=Session,service=org.forest,path=/org/forest/panel/volume,method=togglemuted"
item-0006\description=Toggle Muted
item-0006\trigger=xf86audiomute
item-0007\action="DBUS:bus=Session,service=org.forest,path=/org/forest/panel/volume,method=volumeup"
item-0007\description=Volume Up
item-0007\trigger=xf86audioraisevolume
item-0007\repeat=true
item-0008\action="DBUS:bus=Session,service=org.forest,path=/org/forest/panel/volume,method=volumedown"
item-0008\description=Volume Down
item-0008\trigger=xf86audiolowervolume
item-0008\repeat=true
item-0009\action=bash -c \"brightnessctl set $((`brightnessctl get`-100))\"
item-0009\description=Brightness Down
item-0009\trigger=xf86monbrightnessdown
item-0009\repeat=true
item-0010\action=bash -c \"brightnessctl set $((`brightnessctl get`+100))\"
item-0010\description=Brightness Up
item-0010\trigger=xf86monbrightnessup
item-0010\repeat=true
item-0011\action=forest-screenshot
item-0011\description=screenshot fullscreen
item-0011\trigger=LOGO+s
item-0012\action=forest-screenshot --region
item-0012\description=screenshot region
item-0012\trigger=CTRL+LOGO+s
item-0013\action="DBUS:bus=Session,service=org.forest,path=/org/forest/panel/mainmenu,method=togglemenu"
item-0013\description=Show menu - Meta key
item-0013\trigger=LOGO

[plugins]
plug-0000\enabled=true
plug-0000\name=desktop
plug-0001\enabled=true
plug-0001\name=panel
plug-0002\enabled=true
plug-0002\name=services
