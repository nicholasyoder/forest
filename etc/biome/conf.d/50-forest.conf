# Biome defaults for Forest's layer-shell surfaces. Keys set in
# ~/.config/Biome/Biome.conf override these.
[LayerShell]
fadingNamespaces=forest-logout
scanoutFadingNamespaces=forest-logout-dim,forest-locker-dim,forest-startup

# Decorations/switcher are styled from Forest's themes (biome.css per layer).
# Forest writes Theme/name to ~/.config/Biome/Biome.conf when the theme changes.
[Theme]
dir=/usr/share/forest/themes
name=Round-Dark
